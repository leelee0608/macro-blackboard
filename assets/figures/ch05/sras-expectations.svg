<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">預期物價上升使 SRAS 上移</title><desc id="desc">自然產出 1000、b 為 20。實線 P=100+(Y-1000)/20，虛線 P=102+(Y-1000)/20，LRAS 垂直於 Y=1000。</desc><rect width="760" height="470" fill="#17242d"/><g font-family="sans-serif" font-size="15" fill="#e8edf2"><path d="M90 50V370H660" fill="none" stroke="#a7bac6" stroke-width="2"/><text x="25" y="32">P（指數）</text><text x="460" y="450">Y（每期實質產出單位）</text><path d="M90.0 370v6" stroke="#a7bac6"/><text x="90.0" y="400" text-anchor="middle">900</text><path d="M360.0 370v6" stroke="#a7bac6"/><text x="360.0" y="400" text-anchor="middle">1,000</text><path d="M630.0 370v6" stroke="#a7bac6"/><text x="630.0" y="400" text-anchor="middle">1,100</text><path d="M85 370H650" stroke="#2b3b45"/><text x="76" y="375" text-anchor="end">94</text><path d="M85 282H650" stroke="#2b3b45"/><text x="76" y="287" text-anchor="end">98</text><path d="M85 238H650" stroke="#2b3b45"/><text x="76" y="243" text-anchor="end">100</text><path d="M85 194H650" stroke="#2b3b45"/><text x="76" y="199" text-anchor="end">102</text><path d="M85 106H650" stroke="#2b3b45"/><text x="76" y="111" text-anchor="end">106</text><path d="M85 62H650" stroke="#2b3b45"/><text x="76" y="67" text-anchor="end">108</text><path d="M360.0 50V370" stroke="#b4a4f4" stroke-width="3"/><text x="335.0" y="30" fill="#b4a4f4">LRAS</text><path d="M90.0 348L630.0 128" fill="none" stroke="#5eead4" stroke-width="3" /><circle cx="360.0" cy="238" r="5" fill="#5eead4"/><text x="372.0" y="258" fill="#5eead4">E1 (1,000, 100)</text><path d="M90.0 304L630.0 84" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="9 6"/><circle cx="360.0" cy="194" r="5" fill="#fde68a"/><text x="372.0" y="214" fill="#fde68a">E2 (1,000, 102)</text><text x="460" y="26" fill="#5eead4">實線 SRAS：Pᵉ = 100</text><text x="460" y="49" fill="#fde68a">虛線 SRAS：Pᵉ = 102</text></g></svg>